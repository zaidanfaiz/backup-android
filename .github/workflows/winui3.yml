name: WinUI 3 Windows desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    name: Build Windows launcher and WinUI 3 runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Rust engine and native Windows launcher
        run: cargo build --release --bin backup-android-core --bin AndroidBackup

      - name: Regression check for required WinUI control resources
        shell: pwsh
        run: |
          [xml]$xaml = Get-Content windows/BackupAndroid.WinUI/App.xaml -Raw
          $dictionaries = $xaml.SelectNodes("//*[local-name()='ResourceDictionary.MergedDictionaries']/*")
          if ($null -eq $dictionaries -or $dictionaries.Count -lt 1 -or
              $dictionaries.Item(0).LocalName -ne 'XamlControlsResources') {
            throw "WinUI default styles must be the first merged App.xaml dictionary"
          }
          Write-Host "XamlControlsResources is registered before app-specific resources"
          $appCode = Get-Content windows/BackupAndroid.WinUI/App.xaml.cs -Raw
          if ($appCode -match '(?m)^\s*(?:var\s+\w+\s*=\s*)?Resources\.MergedDictionaries') {
            throw "Do not access Application.Resources in the App constructor; it can throw 0x8000FFFF"
          }

      - name: Publish WinUI 3 into private application directory
        shell: pwsh
        run: |
          dotnet publish windows/BackupAndroid.WinUI/BackupAndroid.WinUI.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -o "$env:GITHUB_WORKSPACE/dist/AndroidBackup/App"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage human-friendly portable application layout
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/dist/AndroidBackup"
          New-Item -ItemType Directory -Force -Path "$out/App/backend" | Out-Null
          Copy-Item target/release/AndroidBackup.exe "$out/AndroidBackup.exe"
          Copy-Item target/release/backup-android-core.exe "$out/App/backend/backup-android-core.exe"
          Copy-Item docs/WINDOWS_INSTALL.txt "$out/README.txt"
          foreach ($folder in @('Language', 'Config', 'Logs')) {
            Copy-Item -Path $folder -Destination "$out/$folder" -Recurse
          }
          if (-not (Test-Path "$out/AndroidBackup.exe")) { throw "Native launcher missing" }
          if (-not (Test-Path "$out/App/AndroidBackup.exe")) { throw "WinUI executable missing" }
          if (-not (Test-Path "$out/App/AndroidBackup.pri")) { throw "WinUI resource index missing" }
          if (-not (Test-Path "$out/App/Microsoft.ui.xaml.dll")) { throw "WinUI runtime DLL missing" }
          if (-not (Test-Path "$out/App/Assets/icon.ico")) { throw "App icon missing" }
          if (-not (Test-Path "$out/App/backend/backup-android-core.exe")) { throw "Rust engine missing" }
          foreach ($item in @('Language/en-US/README.txt', 'Language/id-ID/README.txt', 'Config/README.txt', 'Logs/README.txt')) {
            if (-not (Test-Path (Join-Path $out $item))) { throw "Missing distribution folder asset: $item" }
          }
          $manifest = Get-Content windows/BackupAndroid.WinUI/app.manifest -Raw
          if ($manifest -notmatch 'requestedExecutionLevel level="requireAdministrator"') { throw "UAC declaration missing" }
          $topFiles = @(Get-ChildItem -LiteralPath $out -File)
          if ($topFiles.Count -ne 2) { throw "Unexpected files in release root: $($topFiles.Name -join ', ')" }
          Write-Host "Verified clean portable root with EXE + README; runtime, languages and engine are nested under App."

      - name: Automated installation preflight
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/dist/AndroidBackup"
          $check = Start-Process -FilePath "$out/AndroidBackup.exe" -ArgumentList "--check-install" -WorkingDirectory $out -Wait -PassThru
          if ($check.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "AndroidBackup/Logs/launcher.log"
            if (Test-Path $log) { Get-Content $log -Tail 10 }
            throw "Launcher installation preflight failed (exit code $($check.ExitCode))"
          }
          $log = Join-Path $env:LOCALAPPDATA "AndroidBackup/Logs/launcher.log"
          if (-not (Test-Path $log)) { throw "Expected launcher diagnostic log missing" }
          Get-Content $log -Tail 5
          $portableLog = "$out/Logs/launcher.log"
          if (-not (Test-Path $portableLog)) { throw "Expected portable log mirror missing" }
          Get-Content $portableLog -Tail 5

      - name: Attempt WinUI startup smoke test
        shell: pwsh
        run: |
          # Windows hosted CI has no guaranteed interactive desktop. This check
          # fails for actual XAML startup exceptions if the process launches,
          # but reports an unavailable desktop as inconclusive.
          $exe = "$env:GITHUB_WORKSPACE/dist/AndroidBackup/App/AndroidBackup.exe"
          $log = Join-Path $env:LOCALAPPDATA "AndroidBackup/Logs/startup.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $p = $null
          try {
            try {
              $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -ErrorAction Stop
            } catch {
              Write-Warning "Interactive GUI launch unavailable on CI runner: $_"
            }
            if ($null -ne $p) {
              Start-Sleep -Seconds 6
              if (Test-Path $log) {
                $messages = Get-Content $log -Raw
                Write-Host $messages
                if ($messages -match 'App\.InitializeComponent:|WinUI window initialization:|Unhandled XAML exception') {
                  throw "WinUI emitted a startup exception. See log above."
                }
                if ($messages -match 'Main window activated\.') {
                  Write-Host "WinUI interactive startup reached an activated window."
                } else {
                  Write-Warning "No activation marker; runner may not support interactive WinUI. Manual PC validation required."
                }
              } else {
                Write-Warning "No WinUI startup log; runner may not expose an interactive desktop."
              }
            }
          } finally {
            if ($null -ne $p) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Exercise native navigation, scrolling and app selection
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE/dist/AndroidBackup/App/AndroidBackup.exe"
          $log = Join-Path $env:LOCALAPPDATA "AndroidBackup/Logs/startup.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList "--ui-smoke" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "WinUI UI smoke test exited with $($proc.ExitCode)"
          }
          if (-not (Test-Path $log)) { throw "WinUI smoke test created no startup log" }
          $content = Get-Content $log -Raw
          Write-Host $content
          if ($content -notmatch 'UI smoke: navigation, six scroll viewers and app filtering passed') {
            throw "WinUI navigation and scroll smoke marker missing"
          }
          if ($content -notmatch 'UI smoke: app data backup presets passed') {
            throw "WinUI app backup profile smoke marker missing"
          }
          if ($content -notmatch 'UI smoke complete after render') {
            throw "WinUI smoke did not finish its deferred rendering window"
          }
          if ($content -match 'Unhandled XAML exception|UI smoke interaction|WinUI window initialization:') {
            throw "WinUI reported an XAML startup error during navigation smoke test"
          }

      - name: Upload complete portable application
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBackup-WinUI3-Windows-x64
          path: dist/AndroidBackup/
          if-no-files-found: error
          compression-level: 6
