name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

      - name: Build native Windows release executable
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: Verify Windows GUI subsystem and static VC runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'target/release/backup-android.exe').Path
          $content = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($content, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($content, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), got $subsystem" }
          $ascii = [System.Text.Encoding]::ASCII.GetString($content)
          if ($ascii -match '(?i)VCRUNTIME140(_1)?\\.DLL') {
            throw "Possible dynamic VC runtime dependency found in exe"
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw "Executable icon missing" }
          $icon.Dispose()
          Write-Host "Validated Windows GUI subsystem, no VC runtime string, executable icon."

      - name: Upload Windows portable release
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: android-backup-windows-x64-portable
          path: target/release/backup-android.exe
          if-no-files-found: error
