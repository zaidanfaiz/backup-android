[package]
name = "backup-android"
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
description = "Root-aware Android backup engine for the WinUI 3 desktop frontend"
repository = "https://github.com/zaidanfaiz/backup-android"
publish = false

[[bin]]
name = "backup-android-core"
path = "src/main.rs"

[[bin]]
name = "AndroidBackup"
path = "src/bin/launcher.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry"] }
