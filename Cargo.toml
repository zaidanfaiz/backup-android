[package]
name = "backup-android"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Root-aware Android backup engine for the WinUI 3 desktop frontend"
repository = "https://github.com/zaidanfaiz/backup-android"
publish = false

[[bin]]
name = "backup-android-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
